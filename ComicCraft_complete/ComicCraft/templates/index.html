<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComicCraft — AI Comic Story Creator</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <p class="eyebrow">GEMINI + IMAGE AI</p>
      <h1>ComicCraft</h1>
      <p>Turn one idea into a complete illustrated comic.</p>
    </section>

    {% if error %}
    <div class="alert error">
      <strong>Generation failed.</strong>
      <span>{{ error }}</span>
      <small>Check your .env keys/model settings, then try again.</small>
    </div>
    {% endif %}

    <form class="card form-card" action="/generate" method="post" id="comic-form">
      <label>
        Story prompt
        <textarea name="story_prompt" required minlength="5" maxlength="2000"
          placeholder="A brave fox exploring an enchanted forest">{{ form.story_prompt if form else "" }}</textarea>
      </label>

      <div class="grid-2">
        <label>
          Main character
          <input name="character_name" required maxlength="80"
            placeholder="Fenn" value="{{ form.character_name if form else '' }}">
        </label>
        <label>
          Setting
          <input name="setting" required maxlength="120"
            placeholder="Enchanted forest" value="{{ form.setting if form else '' }}">
        </label>
      </div>

      <div class="grid-3">
        <label>
          Tone
          <select name="tone">
            {% for value in ["light-hearted", "dramatic", "poetic", "funny"] %}
            <option value="{{ value }}" {% if form and form.tone == value %}selected{% elif not form and value == "dramatic" %}selected{% endif %}>{{ value|title }}</option>
            {% endfor %}
          </select>
        </label>

        <label>
          Art style
          <select name="art_style">
            {% for value in ["anime", "pixel art", "comic book", "realistic"] %}
            <option value="{{ value }}" {% if form and form.art_style == value %}selected{% elif not form and value == "comic book" %}selected{% endif %}>{{ value|title }}</option>
            {% endfor %}
          </select>
        </label>

        <label>
          Panels
          <input name="panels" type="number" min="1" max="{{ max_panels }}"
            value="{{ form.panels if form else default_panels }}">
        </label>
      </div>

      <button class="primary" type="submit" id="generate-button">
        <span>✨ Generate Comic</span>
      </button>
      <p class="hint">Generation can take a few minutes when live image AI is enabled.</p>
    </form>

    <footer>
      <a href="/docs">API Docs</a>
      <span>•</span>
      <a href="/health">Health</a>
    </footer>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
